  <rect x="77" y="139" width="207" height="65" rx="9" fill="#f0e7f7" stroke="#a28ab6"/>
  <rect x="321" y="139" width="209" height="65" rx="9" fill="#f0e7f7" stroke="#a28ab6"/>

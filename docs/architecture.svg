<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="694" viewBox="0 0 1140 694" role="img" aria-labelledby="title desc">
  <title id="title">OpenArm ROS 2 control and Sim-to-Real architecture</title>
  <desc id="desc">Within a Docker Compose host, the Isaac container connects to the ROS 2 control container through camera, state and action interfaces. A future physical driver can supply the same interfaces. Perception feeds safety and avoidance. The target node works with MoveIt and avoidance before commanding either backend.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#405b70"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #182d3d; }
      .title { font-size: 26px; font-weight: bold; }
      .section { font-size: 20px; font-weight: bold; }
      .package { font-size: 16px; font-weight: bold; }
      .detail { font-size: 14px; fill: #314d60; }
      .topic { font: 13px monospace; fill: #254458; }
      .label { font-size: 13px; fill: #314d60; }
      .flow { fill: none; stroke: #405b70; stroke-width: 1.7; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
      .node { fill: #eaf3fd; stroke: #7398c2; stroke-width: 1.2; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1140" height="694" fill="#ffffff"/>
  <rect x="18" y="18" width="1104" height="658" rx="22" fill="#edf5ed" stroke="#8da795" stroke-width="1.4"/>

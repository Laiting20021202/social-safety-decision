<path d="M655 713H771" class="wire"/><text x="714" y="700" text-anchor="middle" class="port">點雲</text>
<rect x="775" y="689" width="391" height="48" rx="8" class="node"/><text x="971" y="719" text-anchor="middle" class="small">laiting-isaac-curl-station　RViz / MoveIt / JTC</text>
<path d="M971 736V751H181V740" class="cmd"/>

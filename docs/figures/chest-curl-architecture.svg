<rect x="58" y="363" width="109" height="57" rx="7" class="device"/>
<text x="112" y="387" text-anchor="middle" class="n">OpenArm</text>
<text x="112" y="407" text-anchor="middle" class="small">CAN-FD</text>
<rect x="194" y="363" width="142" height="57" rx="7" class="node"/>
<text x="264" y="397" text-anchor="middle" class="n">ros2_control</text>
<path d="M168 382H192" class="wire"/><path d="M194 403H170" class="cmd"/>

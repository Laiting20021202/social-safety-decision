<text x="48" y="627" class="h">本次 Isaac 實驗　ROS_DOMAIN_ID=89</text>
<text x="50" y="660" class="sub">本機 Isaac Docker 產生胸口 RGB-D 與 PhysX 關節回授。Thor 使用獨立模擬容器，本機控制 Docker 執行相同的感知與規劃。</text>
<rect x="53" y="689" width="258" height="48" rx="8" class="node"/><text x="182" y="719" text-anchor="middle" class="small">laiting-isaac-fixed-world</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">OpenArm 三台主機、Docker 與 ROS 2 資料流</title>
<desc id="desc">上圖為實機配置。控制 NUC 發布胸口 RGB-D 與關節，Thor 輸出點雲，工作站顯示 RViz 並經人手檢查與 MoveIt 規劃回傳短軌跡。下圖顯示實際錄影使用的模擬部署，Isaac 取代 NUC 的感測器與馬達。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#263e49"/></marker><marker id="return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#915121"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK TC","Microsoft JhengHei",Arial,sans-serif;fill:#192e37}
.head{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#455e69}.host{fill:#e4efe1;stroke:#8aab83;stroke-width:1.5}.h{font-size:23px;font-weight:700}
.container{fill:#f7f8f5;stroke:#9ba9a7;stroke-width:1.15}.name{font:14px "DejaVu Sans Mono",monospace;fill:#3a5058}
.node{fill:#e5effb;stroke:#789cc4;stroke-width:1.2}.device{fill:#efe6f2;stroke:#ae8fbb}.n{font-size:18px;font-weight:600}.small{font-size:15px}
.wire{fill:none;stroke:#263e49;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}.cmd{fill:none;stroke:#915121;stroke-width:2.1;stroke-linejoin:round;marker-end:url(#return)}
.port{font-size:15px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
</style>
<rect x="1" y="1" width="1278" height="788" fill="#fff" stroke="#d5deda" rx="16"/>
<text x="32" y="45" class="head">OpenArm　三台主機與 ROS 2 資料流</text>
<text x="33" y="76" class="sub">實機配置　ROS_DOMAIN_ID=88　｜　Fast DDS / host network　｜　相機、關節與運動命令皆經 ROS 2</text>
<rect x="26" y="111" width="345" height="415" rx="23" class="host"/>
<rect x="459" y="111" width="311" height="199" rx="23" class="host"/>
<rect x="865" y="111" width="389" height="415" rx="23" class="host"/>
<text x="48" y="150" class="h">OpenArm 控制 NUC</text>
<text x="477" y="150" class="h">Jetson Thor</text>
<text x="884" y="150" class="h">本機工作站</text>
<rect x="44" y="170" width="308" height="109" rx="13" class="container"/>
<text x="59" y="194" class="name">laiting-openarm-d415</text>
<rect x="58" y="211" width="109" height="49" rx="7" class="device"/>
<text x="112" y="242" text-anchor="middle" class="n">胸口 D415</text>
<path d="M168 235H192" class="wire"/>
<rect x="194" y="211" width="142" height="49" rx="7" class="node"/>

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-safety-amr"
version = "0.1.0"
description = "Dataset playback and safety planning workbench for AMR social safety."
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "NTHU HRC Lab"}]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.1",
  "PyYAML==6.0.2",
  "huggingface-hub==0.27.0",
  "pillow==11.0.0",
  "python-multipart==0.0.20",
  "numpy>=1.26,<2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
  "mypy==1.14.1",
  "types-PyYAML==6.0.12.20241230",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "gpu: requires a CUDA-capable NVIDIA GPU",
  "model_access: requires authorized model checkpoint access",
  "slow: long-running integration or E2E test",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
plugins = []
strict = true
ignore_missing_imports = true

services:
  dataset-service:
    profiles: ["cuda-full"]
    environment:
      SAM3_SERVICE_URL: http://sam3-service:8020
      DATASET_CACHE_DIR: /cache/dataset
      SAM3_ANALYSIS_WIDTH: 640
      SAM3_ANALYSIS_HEIGHT: 360
      SAM3_TRACKING_FPS: 5
      SAM3_MAX_OBJECTS: 6
    depends_on:
      - sam3-service

  sam3-service:
    profiles: ["cuda-full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sam3.cuda
    ports:
      - "8020:8020"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/huggingface
      SAM3_IMAGE_REPO: facebook/sam3
      SAM3_VIDEO_REPO: facebook/sam3.1
      SAM3_MAX_OBJECTS: 6
      SAM3_MULTIPLEX_COUNT: 16
      SAM3_USE_FA3: "false"
      SAM3_USE_ROPE_REAL: "false"
      SAM3_COMPILE: "false"
      SAM3_WARM_UP: "false"
      SAM3_ASYNC_LOADING_FRAMES: "true"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - hf_cache:/models/huggingface
      - dataset_cache:/cache/dataset
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8020/health"]
      interval: 60s
      timeout: 10s
      retries: 5

  robopoint-service:
    profiles: ["cuda-full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.robopoint.cuda
    ports:
      - "8030:8030"
    volumes:
      - robopoint_weights:/models/robopoint
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped

  vqa-service:
    profiles: ["cuda-full"]
    build:
      context: .
      dockerfile: docker/Dockerfile.vqa.cuda
    ports:
      - "8040:8040"
    volumes:
      - vqa_weights:/models/vqa
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    restart: unless-stopped

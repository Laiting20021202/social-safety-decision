name: st4rtrack_viewer
mode: reconstruction
people_overlay: true
device: cuda
scale_mode: relative
video:
  queue_size: 2
  loop: false
  playback_speed: 1.0
segmentation:
  model: yolo11s-seg.pt
  input_size: 640
  confidence: 0.45
  iou: 0.5
  frequency_hz: 10.0
  fp16: true
reconstruction:
  depth_mode: video_depth
  model: depth-anything/Depth-Anything-V2-Small-hf
  st4rtrack_path: third_party/St4RTrack
  video_depth_path: third_party/Video-Depth-Anything
  input_size: 280
  frequency_hz: 12.0
  fast_depth_frequency_hz: 8.0
  max_points: 24000
  voxel_size: 0.01
  confidence_threshold: 0.0
  display_confidence_threshold: 1.00001
  filter_sky: true
  max_relative_depth: 30.0
  anchor_interval: 0
  fp16: true
tracking:
  max_missing: 12
  visual_hold_updates: 2
  iou_threshold: 0.2
  association_distance: 1.5
  dynamic_enter_speed: 0.15
  dynamic_exit_speed: 0.08
  minimum_dynamic_hits: 3
safety:
  target_hz: 10.0
  prediction_horizon: 3.0
  prediction_timestep: 0.2
  robot_radius: 0.35
  safety_margin: 0.2
  uncertainty_gain: 0.25
  stop_ttc: 1.0
  warning_ttc: 2.5
  stop_clearance: 0.4
  warning_clearance: 0.8
  release_safe_updates: 5
gui:
  host: 127.0.0.1
  port: 8080
  max_video_width: 640
  point_size: 0.0025
  history_frames: 1
  history_stride: 1
